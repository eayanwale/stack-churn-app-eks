apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackit-churn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # point this at YOUR fork/repo that holds the k8s/ manifests
    repoURL: https://github.com/<your-org>/stackit-churn-app.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: stackit-churn
  syncPolicy:
    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # revert manual drift back to Git state
    syncOptions:
      - CreateNamespace=true
