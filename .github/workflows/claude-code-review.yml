name: Claude Code Review

on:
  push:
    branches: [main]
    paths:
      - "app/**/*.py"
      - "train/**/*.py"
      - "sagemaker/**/*.py"
      - "tests/**/*.py"
      - "wsgi.py"
      - "terraform/**/*.tf"
      - "Dockerfile"
      - "k8s/**/*.yaml"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the code changed in this push (commit ${{ github.sha }}).
            Use `git diff HEAD~1 HEAD` to see the changes, then read the changed
            files in full. Look for bugs, security issues, and bad practices.
            Report findings in a concise list with file and line references.
            If nothing is wrong, say so.
          claude_args: '--allowedTools "Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"'
